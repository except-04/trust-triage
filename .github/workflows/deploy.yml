name: Manual deploy

on:
  workflow_dispatch:
    inputs:
      schema_migration_confirmed:
        description: "I have applied and verified the production DB migration for the approved SHA."
        type: boolean
        default: false
      schema_approved_sha:
        description: "Full 40-character commit SHA whose production DB migration was verified."
        type: string
        default: ""
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: trust-triage-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # No environment: the IAM trust policy expects the main-branch OIDC subject.
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_PAGER: ""
      AWS_MAX_ATTEMPTS: "2"
      TARGET_SHA: ${{ github.sha }}
      SCHEMA_MIGRATION_CONFIRMED: ${{ github.event_name == 'workflow_dispatch' && inputs.schema_migration_confirmed == true && 'true' || 'false' }}
      SCHEMA_APPROVED_SHA: ${{ inputs.schema_approved_sha || '' }}

    steps:
      - name: Validate branch and configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this deployment from main only."
            exit 1
          fi
          for variable in AWS_DEPLOY_ROLE_ARN AWS_REGION EC2_INSTANCE_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing repository variable: $variable"
              exit 1
            fi
          done
          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-([0-9a-f]{8}|[0-9a-f]{17})$ ]]; then
            echo "::error::EC2_INSTANCE_ID must contain exactly one EC2 instance ID."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid deployment commit SHA."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$SCHEMA_MIGRATION_CONFIRMED" == "true" ]]; then
            if [[ ! "$SCHEMA_APPROVED_SHA" =~ ^[0-9a-f]{40}$ || "$SCHEMA_APPROVED_SHA" != "$TARGET_SHA" ]]; then
              echo "::error::Schema approval requires the exact full TARGET_SHA whose migration was verified."
              exit 1
            fi
          fi

      - name: Assume AWS role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubDeploy-${{ github.run_id }}
          role-duration-seconds: 1800
          unset-current-credentials: true

      # The workflow carries the fixed deployment procedure; no runner checkout needed.
      - name: Deploy through SSM and verify completion
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shlex
          import subprocess
          import time

          instance_id = os.environ["EC2_INSTANCE_ID"]
          target_sha = os.environ["TARGET_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", target_sha):
              raise SystemExit("Invalid TARGET_SHA.")
          print(f"TARGET_SHA={target_sha}", flush=True)
          approval_context = {
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "confirmed": os.environ.get("SCHEMA_MIGRATION_CONFIRMED") == "true",
              "approved_sha": os.environ.get("SCHEMA_APPROVED_SHA", ""),
              "actor": os.environ["GITHUB_ACTOR"],
              "run_id": os.environ["GITHUB_RUN_ID"],
          }

          # Runs under the existing EC2 venv. Git always runs as ubuntu, not SSM root.
          remote_program = r"""
          import fcntl
          import fnmatch
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import subprocess
          import sys
          import time
          import urllib.request

          REPO = "/home/ubuntu/trust-triage"
          SERVICES = (
              "trust-triage-speakeasy.service",
              "trust-triage-processor.service",
              "trust-triage-api.service",
              "trust-triage-dashboard.service",
          )

          def run(args, *, timeout=30, required=True):
              try:
                  result = subprocess.run(
                      args, capture_output=True, text=True, timeout=timeout,
                      env=dict(os.environ, GIT_TERMINAL_PROMPT="0", GIT_OPTIONAL_LOCKS="0"),
                  )
              except subprocess.TimeoutExpired:
                  raise RuntimeError("Command timed out; no automatic rollback.") from None
              if required and result.returncode:
                  # Do not print raw Git errors, remote URLs, environment, or file contents.
                  raise RuntimeError(f"Command failed (exit {result.returncode}).")
              return result

          def git(*args, required=True, timeout=30):
              return run(
                  ["runuser", "-u", "ubuntu", "--", "git", "-C", REPO,
                   "-c", "core.hooksPath=/dev/null", *args],
                  required=required, timeout=timeout,
              )

          def clean_tree():
              if git("status", "--porcelain=v1", "--untracked-files=all",
                     "--ignore-submodules=none").stdout:
                  raise RuntimeError("Dirty working tree: deployment refused; no files removed.")

          # Exact runtime inputs, not directories containing related application code.
          DB_SCHEMA_PATHS = {
              "src/trust_triage/backend_api/schema.sql",
              "src/trust_triage/deep_analysis/service_schema.sql",
              "src/trust_triage/speakeasy_worker/schema.sql",
          }
          # No migration directory currently exists; register real migration roots here.
          DB_MIGRATION_DIRS = ()
          # References: docs/shap-explanation-module.md, src/jrr/generate_raw_probas.py,
          # src/jrr/train_calibrator.py and src/jrr/jrr_router.py. Backend paths are
          # configurable via BACKEND_*_PATH: register any custom deployment paths here
          # before allowing Git to manage those files. Do not read or print .env values.
          RUNTIME_MODEL_PATHS = {
              "models/baseline_model_lightgbm_tuned_500_4way.pkl",
              "data/baseline_model_lightgbm_tuned_500_4way.pkl",
              "data/baseline_model_xgb_500_4way_1000cap.pkl",
              "data/jrr_calibrator_4way.pkl",
              "data/jrr_risk_signals.pkl",
              "data/top_feature_indices_500.npy",
              "docs/feature-extraction/feature-selection-ember-v3-top500.json",
          }

          def schema_approval(target, context):
              # An attestation only: this workflow never applies a DB migration.
              # Recheck the event remotely; push must never inherit a schema exception.
              if (context.get("event_name") != "workflow_dispatch"
                      or context.get("ref") != "refs/heads/main"
                      or context.get("confirmed") is not True):
                  return False
              approved_sha = context.get("approved_sha", "")
              if (not isinstance(approved_sha, str)
                      or not re.fullmatch(r"[0-9a-f]{40}", approved_sha)
                      or approved_sha != target):
                  raise RuntimeError("Schema approval requires the exact full TARGET_SHA whose migration was verified.")
              return True

          def blocked_reason(path, old_mode, new_mode, status, *, schema_approved=False):
              p = PurePosixPath(path)
              name = p.name
              if fnmatch.fnmatchcase(name, "requirements*.txt") or name == "pyproject.toml":
                  return "dependency change requires a manual release"
              virtualenvs = ("venv", ".venv", "env")
              if str(p) in virtualenvs or str(p).startswith(tuple(root + "/" for root in virtualenvs)):
                  return "runtime environment must be preserved"
              is_template = name.endswith((".example", ".template"))
              if not is_template and (
                  name == ".env" or name.startswith(".env.") or name.endswith(".env")
                  or str(p) in {".streamlit", ".streamlit/secrets.toml"}
              ):
                  return "runtime environment must be preserved"
              if str(p) in DB_SCHEMA_PATHS:
                  if not schema_approved:
                      return "schema/migration change requires an approved manual release"
                  regular_modes = {"100644", "100755"}
                  ordinary_sql_change = (
                      (status == "A" and old_mode == "000000" and new_mode in regular_modes)
                      or (status == "D" and old_mode in regular_modes and new_mode == "000000")
                      or (status == "M" and old_mode in regular_modes and new_mode in regular_modes)
                  )
                  if not ordinary_sql_change:
                      return "schema approval permits only regular SQL file changes, not symlinks/gitlinks"
                  # Keep checking every other protected-path rule below.
              if any(str(p) == root or str(p).startswith(root + "/") for root in DB_MIGRATION_DIRS):
                  return "schema/migration change requires an approved manual release"
              if (str(p) in RUNTIME_MODEL_PATHS
                      or any(model.startswith(str(p) + "/") for model in RUNTIME_MODEL_PATHS)):
                  # Also reject replacing a parent directory with a symlink/gitlink.
                  return "model artifact/contract change requires a manual release"
              if "160000" in {old_mode, new_mode}:
                  if path == "EMBER2024" and (old_mode, new_mode, status) == ("160000", "000000", "D"):
                      return None  # Remove only the stale gitlink; not a model replacement.
                  return "submodule change requires review of its actual contents"
              return None

          def protected_changes(previous, target, *, schema_approved=False):
              # Raw metadata distinguishes gitlinks from files. With rename detection
              # disabled, a move checks both the deletion and addition paths.
              raw = git("diff", "--raw", "--no-abbrev", "--no-renames", "-z", previous, target, "--").stdout
              if not raw:
                  print("SCHEMA_MANUAL_APPROVAL_USED=false", flush=True)
                  return []
              records = raw.split("\0")
              if records.pop() != "" or len(records) % 2:
                  raise RuntimeError("Invalid Git change metadata; deployment refused.")
              blocked = []
              approval_used = False
              for header, path in zip(records[::2], records[1::2]):
                  fields = header.split()
                  if len(fields) != 5 or not fields[0].startswith(":") or not path:
                      raise RuntimeError("Invalid Git change metadata; deployment refused.")
                  old_mode, new_mode = fields[0][1:], fields[1]
                  status = fields[4]
                  if (old_mode not in {"000000", "100644", "100755", "120000", "160000"}
                          or new_mode not in {"000000", "100644", "100755", "120000", "160000"}
                          or status not in {"A", "D", "M", "T"}):
                      raise RuntimeError("Unsupported Git change metadata; deployment refused.")
                  reason = blocked_reason(path, old_mode, new_mode, status, schema_approved=schema_approved)
                  if reason:
                      blocked.append((path, reason))
                  elif path in DB_SCHEMA_PATHS and schema_approved:
                      approval_used = True
                      print(f"APPROVED_SCHEMA_PATH={json.dumps(path)}", flush=True)
              print(f"SCHEMA_MANUAL_APPROVAL_USED={str(approval_used).lower()}", flush=True)
              return blocked

          def http_health(label, url, *, backend=False):
              # Ignore proxy environment for loopback probes; never print response bodies.
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline:
                  try:
                      with opener.open(url, timeout=5) as response:
                          body = response.read(4096)
                          valid = response.status == 200
                          valid = valid and (
                              json.loads(body).get("status") == "ok" if backend
                              else body.strip().lower() == b"ok"
                          )
                          if valid:
                              print(f"{label} health: OK", flush=True)
                              return True
                  except (OSError, ValueError, AttributeError):
                      pass
                  time.sleep(3)
              print(f"{label} health: FAILED", flush=True)
              return False

          def deploy(target, approval_context):
              if not re.fullmatch(r"[0-9a-f]{40}", target):
                  raise RuntimeError("Invalid TARGET_SHA.")
              print(f"GITHUB_ACTOR={json.dumps(approval_context.get('actor', ''))}", flush=True)
              print(f"GITHUB_RUN_ID={json.dumps(approval_context.get('run_id', ''))}", flush=True)
              schema_approved = schema_approval(target, approval_context)
              print(f"SCHEMA_MANUAL_APPROVAL_VALID={str(schema_approved).lower()}", flush=True)
              if os.geteuid() != 0 or not Path(REPO).is_dir():
                  raise RuntimeError("SSM root execution and the configured repository are required.")
              # Host lock also prevents overlap with a still-running, disconnected SSM invocation.
              with open("/run/lock/trust-triage-deploy.lock", "a") as lock:
                  try:
                      fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                  except BlockingIOError:
                      raise RuntimeError("Another deployment is already running.") from None
                  print("Stage: working-tree preflight", flush=True)
                  clean_tree()
                  if git("rev-parse", "--show-toplevel").stdout.strip() != REPO:
                      raise RuntimeError("Unexpected repository root.")
                  if git("symbolic-ref", "--quiet", "--short", "HEAD").stdout.strip() != "main":
                      raise RuntimeError("EC2 repository must already be on main.")
                  previous = git("rev-parse", "--verify", "HEAD").stdout.strip()
                  if not re.fullmatch(r"[0-9a-f]{40}", previous):
                      raise RuntimeError("Invalid PREVIOUS_SHA.")
                  # These lines persist in SSM output, including failures after this point.
                  print(f"PREVIOUS_SHA={previous}", flush=True)
                  print(f"TARGET_SHA={target}", flush=True)
                  print("Stage: fetch and commit validation", flush=True)
                  git("fetch", "origin", "main", timeout=90)
                  main_sha = git("rev-parse", "--verify", "FETCH_HEAD^{commit}").stdout.strip()
                  git("cat-file", "-e", target + "^{commit}")
                  if git("merge-base", "--is-ancestor", target, main_sha, required=False).returncode:
                      raise RuntimeError("TARGET_SHA is not a commit on fetched origin/main.")
                  if git("merge-base", "--is-ancestor", previous, target, required=False).returncode:
                      raise RuntimeError("Update is not fast-forward; deployment refused.")
                  print("Stage: protected-path validation", flush=True)
                  blocked = protected_changes(previous, target, schema_approved=schema_approved)
                  if blocked:
                      for path, reason in blocked:
                          print(f"BLOCKED {json.dumps(path)}: {reason}", flush=True)
                      raise RuntimeError("Protected changes detected; code and services left unchanged.")
                  clean_tree()
                  if (git("rev-parse", "HEAD").stdout.strip() != previous
                          or git("symbolic-ref", "--quiet", "--short", "HEAD").stdout.strip() != "main"):
                      raise RuntimeError("Repository changed during preflight.")
                  print("Stage: fast-forward update", flush=True)
                  git("merge", "--ff-only", "--no-edit", "--no-overwrite-ignore", target, timeout=60)
                  if git("rev-parse", "HEAD").stdout.strip() != target:
                      raise RuntimeError("HEAD does not equal TARGET_SHA; services not restarted.")
                  clean_tree()
                  print("Stage: restart services", flush=True)
                  failed = False
                  for service in SERVICES:
                      result = run(["systemctl", "restart", service], timeout=120, required=False)
                      print(f"Restart {service}: exit {result.returncode}", flush=True)
                      failed = failed or result.returncode != 0
                  for service in SERVICES:
                      result = run(["systemctl", "is-active", "--quiet", service], required=False)
                      print(f"Active {service}: {result.returncode == 0}", flush=True)
                      failed = failed or result.returncode != 0
                  if not http_health("Backend", "http://127.0.0.1:8000/health", backend=True):
                      failed = True
                  if not http_health("Dashboard", "http://127.0.0.1:8501/_stcore/health"):
                      failed = True
                  # Catch processes that exited while HTTP probes were running.
                  for service in SERVICES:
                      if run(["systemctl", "is-active", "--quiet", service], required=False).returncode:
                          print(f"Final active check failed: {service}", flush=True)
                          failed = True
                  if failed:
                      raise RuntimeError("Deployment verification failed; no automatic rollback.")
                  print("Deployment verified.", flush=True)

          try:
              deploy(sys.argv[1], json.loads(sys.argv[2]))
          except (RuntimeError, OSError) as error:
              # RuntimeError messages above are fixed/safe; suppress arbitrary OS error details.
              message = str(error) if isinstance(error, RuntimeError) else type(error).__name__
              print(f"DEPLOYMENT FAILED: {message}", flush=True)
              sys.exit(1)
          """
          remote_script = shlex.join([
              "/home/ubuntu/trust-triage/venv/bin/python", "-B", "-c", remote_program, target_sha,
              json.dumps(approval_context),
          ])

          def aws(*args):
              return subprocess.run(
                  ["aws", *args, "--output", "json", "--no-cli-pager",
                   "--cli-connect-timeout", "10", "--cli-read-timeout", "10"],
                  text=True, capture_output=True, check=False, timeout=60,
              )

          sent = aws(
              "ssm", "send-command",
              "--instance-ids", instance_id,
              "--document-name", "AWS-RunShellScript",
              "--comment", f"TRUST-Triage manual deploy {target_sha}",
              "--timeout-seconds", "120",
              "--parameters", json.dumps({
                  "commands": [remote_script], "executionTimeout": ["900"],
              }),
          )
          if sent.returncode:
              print(sent.stderr, flush=True)
              raise SystemExit("SSM SendCommand failed.")

          command_id = json.loads(sent.stdout)["Command"]["CommandId"]
          print(f"SSM CommandId: {command_id}", flush=True)
          deadline = time.monotonic() + 1080
          while time.monotonic() < deadline:
              invocation = aws(
                  "ssm", "get-command-invocation",
                  "--command-id", command_id, "--instance-id", instance_id,
              )
              if invocation.returncode:
                  # Run Command is eventually consistent immediately after submission.
                  if "InvocationDoesNotExist" in invocation.stderr:
                      time.sleep(5)
                      continue
                  print(invocation.stderr, flush=True)
                  raise SystemExit("SSM GetCommandInvocation failed.")

              detail = json.loads(invocation.stdout)
              status = detail["Status"]
              print(f"SSM status: {status}", flush=True)
              if status in {"Pending", "InProgress", "Delayed", "Cancelling"}:
                  time.sleep(5)
                  continue

              print(f"StatusDetails: {detail.get('StatusDetails', '')}")
              print(f"ResponseCode: {detail.get('ResponseCode')}")
              print("--- EC2 stdout ---")
              print(detail.get("StandardOutputContent", ""))
              print("--- EC2 stderr ---")
              print(detail.get("StandardErrorContent", ""), flush=True)
              if status != "Success" or detail.get("ResponseCode") != 0:
                  raise SystemExit("EC2 deployment failed; no automatic rollback.")
              print("Manual deployment passed.")
              break
          else:
              raise SystemExit("SSM polling timed out (1080s); inspect the command before retrying. No rollback performed.")
          PY
