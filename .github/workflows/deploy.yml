name: CD connection test (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  connection-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No environment: the IAM trust policy expects the main-branch OIDC subject.
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_PAGER: ""
      AWS_MAX_ATTEMPTS: "2"

    steps:
      - name: Validate branch and configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this connection test from main only."
            exit 1
          fi
          for variable in AWS_DEPLOY_ROLE_ARN AWS_REGION EC2_INSTANCE_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing repository variable: $variable"
              exit 1
            fi
          done
          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-([0-9a-f]{8}|[0-9a-f]{17})$ ]]; then
            echo "::error::EC2_INSTANCE_ID must contain exactly one EC2 instance ID."
            exit 1
          fi

      - name: Assume AWS role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubReadOnly-${{ github.run_id }}
          role-duration-seconds: 900
          unset-current-credentials: true

      # No checkout, dependency installation, or deployment commands are needed.
      - name: Run read-only SSM checks and wait for completion
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          instance_id = os.environ["EC2_INSTANCE_ID"]
          remote_script = """set -u
          result=0
          whoami || result=1
          pwd || result=1
          if test -d /home/ubuntu/trust-triage; then
            printf 'Repository directory exists: /home/ubuntu/trust-triage\n'
            git -c safe.directory=/home/ubuntu/trust-triage -C /home/ubuntu/trust-triage rev-parse --verify HEAD || result=1
          else
            printf 'Repository directory missing: /home/ubuntu/trust-triage\n' >&2
            result=1
          fi
          for service in trust-triage-api.service trust-triage-dashboard.service trust-triage-processor.service trust-triage-speakeasy.service; do
            printf '%s: ' "$service"
            if ! systemctl is-active "$service"; then
              result=1
            fi
          done
          exit "$result"
          """

          def aws(*args):
              return subprocess.run(
                  ["aws", *args, "--output", "json", "--no-cli-pager",
                   "--cli-connect-timeout", "10", "--cli-read-timeout", "10"],
                  text=True, capture_output=True, check=False, timeout=60,
              )

          sent = aws(
              "ssm", "send-command",
              "--instance-ids", instance_id,
              "--document-name", "AWS-RunShellScript",
              "--comment", "TRUST-Triage read-only OIDC/SSM connection test",
              "--timeout-seconds", "120",
              "--parameters", json.dumps({
                  "commands": [remote_script], "executionTimeout": ["60"],
              }),
          )
          if sent.returncode:
              print(sent.stderr, flush=True)
              raise SystemExit("SSM SendCommand failed.")

          command_id = json.loads(sent.stdout)["Command"]["CommandId"]
          print(f"SSM CommandId: {command_id}", flush=True)
          deadline = time.monotonic() + 300
          while time.monotonic() < deadline:
              invocation = aws(
                  "ssm", "get-command-invocation",
                  "--command-id", command_id, "--instance-id", instance_id,
              )
              if invocation.returncode:
                  # Run Command is eventually consistent immediately after submission.
                  if "InvocationDoesNotExist" in invocation.stderr:
                      time.sleep(5)
                      continue
                  print(invocation.stderr, flush=True)
                  raise SystemExit("SSM GetCommandInvocation failed.")

              detail = json.loads(invocation.stdout)
              status = detail["Status"]
              print(f"SSM status: {status}", flush=True)
              if status in {"Pending", "InProgress", "Delayed", "Cancelling"}:
                  time.sleep(5)
                  continue

              print(f"StatusDetails: {detail.get('StatusDetails', '')}")
              print(f"ResponseCode: {detail.get('ResponseCode')}")
              print("--- EC2 stdout ---")
              print(detail.get("StandardOutputContent", ""))
              print("--- EC2 stderr ---")
              print(detail.get("StandardErrorContent", ""), flush=True)
              if status != "Success" or detail.get("ResponseCode") != 0:
                  raise SystemExit("Read-only EC2 checks failed.")
              print("Read-only OIDC/SSM connection test passed.")
              break
          else:
              raise SystemExit("Timed out waiting for SSM command completion (300s).")
          PY
