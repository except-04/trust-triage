name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python 3.12.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      AWS_EC2_METADATA_DISABLED: "true"
      LLM_ENABLED: "false"
      BACKEND_TEST_DATABASE_URL: ""
      WORKER_TEST_DATABASE_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-backend-dev.txt
            .github/workflows/ci.yml

      # Dashboard tests stub Streamlit but import requests and matplotlib.
      # pytest.ini adds src to pythonpath; no production install or .env is needed.
      # Do not install the full ML/Feature Extraction/Worker requirements here.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-backend-dev.txt "requests>=2.31" "matplotlib>=3.8"
          python -m pip check

      - name: Run initial CI gate
        run: |
          python -m pytest \
            tests/dashboard \
            tests/backend_api \
            tests/test_feature_names.py \
            tests/test_model_data_contract.py \
            -m "not postgres" \
            -q
